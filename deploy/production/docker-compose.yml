# Ops in production on the VPS: ops.career141.com.
#
# Completely isolated from the live TA System: its own Compose project
# (ops-system), its own Postgres container (no host port exposed), its own
# Convex backend (INSTANCE_NAME=ops-prod on 127.0.0.1:3330/3331), its own
# Next.js app (127.0.0.1:3332), and its own volumes. Nothing in here touches
# TA's containers, database, network, or ports.

name: ops-system

services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: convex_ops
    volumes:
      - ops-system-postgres-data:/var/lib/postgresql/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d convex_ops"]
      interval: 10s
      timeout: 5s
      retries: 10

  convex:
    image: ghcr.io/convex/convex-backend:latest
    container_name: ops-system-convex
    restart: unless-stopped
    stop_grace_period: 20s
    stop_signal: SIGINT
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3330:3210"
      - "127.0.0.1:3331:3211"
    environment:
      INSTANCE_NAME: ops-prod
      INSTANCE_SECRET: ${PROD_INSTANCE_SECRET:?set in .env.production}
      POSTGRES_URL: postgresql://ops:${PROD_POSTGRES_PASSWORD:?set in .env.production}@postgres:5432
      DO_NOT_REQUIRE_SSL: "true"
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:3330
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3331
      DISABLE_BEACON: "true"
      RUST_LOG: info
    volumes:
      - ops-system-convex-files:/convex/data
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3210/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    image: ghcr.io/convex/convex-dashboard:latest
    container_name: ops-system-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:6893:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: http://127.0.0.1:3330
    mem_limit: 512m

  app:
    image: ${OPS_IMAGE:-ghcr.io/career141-dev/ops-system:latest}
    container_name: ops-system-app
    restart: unless-stopped
    depends_on:
      convex:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PORT: 3300
      HOSTNAME: 0.0.0.0
      CONVEX_SELF_HOSTED_URL: http://convex:3210
    ports:
      - "127.0.0.1:3332:3300"
    mem_limit: 1g

volumes:
  ops-system-postgres-data:
  ops-system-convex-files:
